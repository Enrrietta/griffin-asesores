name: Actualizar indicadores previsionales

# Lee los indicadores desde PREVIRED una vez al dia y, si cambiaron,
# guarda assets/indicadores.json en el repositorio.

on:
  schedule:
    # 12:00 UTC = 08:00 en Chile (aprox.). Corre todos los dias.
    - cron: '0 12 * * *'
  workflow_dispatch: {}   # permite ejecutarlo a mano desde la pestana Actions

jobs:
  actualizar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Leer indicadores desde PREVIRED
        run: node scripts/scrape-indicadores.mjs

      - name: Guardar cambios si los hay
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/indicadores.json
          if git diff --staged --quiet; then
            echo "Sin cambios en los indicadores."
          else
            git commit -m "Actualizar indicadores previsionales"
            git push
          fi
